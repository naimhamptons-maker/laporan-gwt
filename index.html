<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Laporan GWT">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Laporan Teknisi GWT</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; padding: 12px; }
    .container { max-width: 560px; margin: auto; background: #fff; padding: 20px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 1.2rem; color: #0284c7; }
    .badge { font-size: 0.75rem; padding: 5px 10px; border-radius: 99px; font-weight: 600; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }
    .install-banner { background: #0284c7; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 14px; display: none; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .install-banner button { background: #fff; color: #0284c7; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .setup-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; }
    .setup-box summary { font-weight: 600; color: #1d4ed8; cursor: pointer; }
    label { display: block; font-weight: 600; font-size: 0.875rem; margin: 14px 0 5px; color: #334155; }
    input[type="text"], input[type="date"], input[type="url"], select, textarea {
      width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.12); }
    textarea { resize: vertical; min-height: 80px; }
    .photo-card { border: 1px dashed #94a3b8; border-radius: 8px; padding: 10px; background: #f8fafc; margin-top: 4px; }
    input[type="file"] { width: 100%; font-size: 0.85rem; }
    .preview-img { max-width: 100%; max-height: 160px; margin-top: 8px; border-radius: 6px; display: none; object-fit: cover; }
    .btn { width: 100%; margin-top: 20px; padding: 13px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:active { background: #0369a1; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-sm { padding: 8px 12px; font-size: 0.85rem; margin-top: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn-save-url { background: #1d4ed8; color: #fff; width: 100%; }
    .queue-box { margin-bottom: 16px; padding: 12px; background: #fef9c3; border: 1px solid #fde047; border-radius: 10px; font-size: 0.85rem; display: none; }
    .btn-sync { background: #ca8a04; color: #fff; width: 100%; }
    .history-box { margin-top: 22px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
    .history-item { font-size: 0.82rem; padding: 8px 10px; background: #f8fafc; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid #16a34a; }
    .history-item.pending { border-left-color: #eab308; }
  </style>
</head>
<body>
<div class="container">
  <div id="installBanner" class="install-banner">
    <span>📲 Install aplikasi ini ke HP / PC Anda</span>
    <button type="button" id="installBtn">Install App</button>
  </div>

  <div class="header">
    <h2>Laporan Teknisi GWT</h2>
    <span id="netStatus" class="badge online">Online</span>
  </div>

  <!-- Pengaturan URL Google Apps Script -->
  <details id="setupDetails" class="setup-box">
    <summary>⚙️ Pengaturan Koneksi Google Sheet</summary>
    <p style="margin: 8px 0 6px; color: #475569;">Tempel URL Web App dari Google Apps Script Anda (cukup isi 1 kali di perangkat ini):</p>
    <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button type="button" class="btn-sm btn-save-url" onclick="saveScriptUrl()">Simpan URL Koneksi</button>
  </details>

  <!-- Antrean Offline -->
  <div id="queueBox" class="queue-box">
    <div id="queueText" style="font-weight: 600; color: #854d0e;"></div>
    <button type="button" class="btn-sm btn-sync" id="syncBtn" onclick="syncQueue()">Kirim Semua Antrean Sekarang</button>
  </div>

  <form id="reportForm">
    <label>Tanggal Kerja</label>
    <input type="date" id="Tanggal_Kerja" required>

    <label>Nama Teknisi</label>
    <input type="text" id="Nama_Teknisi" list="teknisiList" placeholder="Pilih atau ketik nama teknisi..." required>
    <datalist id="teknisiList">
      <option value="ADE & YERI">
      <option value="ADE & MADIANTO">
      <option value="ADE & RAFLY">
      <option value="Yeri dan mulyana">
      <option value="Yeri">
      <option value="ADE">
    </datalist>

    <label>Shift</label>
    <select id="Shift" required>
      <option value="Pagi">Pagi</option>
      <option value="Siang">Siang</option>
    </select>

    <label>Lokasi Tower</label>
    <select id="Lokasi_Tower" required>
      <option value="Filter WTP Tower D">Filter WTP Tower D</option>
      <option value="RWT & GWT Tower D B2">RWT & GWT Tower D B2</option>
      <option value="Kolam & R.Pompa Air Mancur">Kolam & R.Pompa Air Mancur</option>
      <option value="Roof Tank Tower D">Roof Tank Tower D</option>
      <option value="Filter WTP Tower A/B B2">Filter WTP Tower A/B B2</option>
      <option value="RWT Tower B B1">RWT Tower B B1</option>
      <option value="Roof Tank Tower A">Roof Tank Tower A</option>
      <option value="Roof Tank Tower B">Roof Tank Tower B</option>
      <option value="Kolam Koi Tower C">Kolam Koi Tower C</option>
      <option value="GWT & CWT A/B/C B1">GWT & CWT A/B/C B1</option>
      <option value="Roof Tank Tower C">Roof Tank Tower C</option>
    </select>

    <label>Uraian Pekerjaan</label>
    <textarea id="Uraian_Pekerjaan" placeholder="Contoh: Backwash sand carbon filter WTP..." required></textarea>

    <label>Foto Sebelum</label>
    <div class="photo-card">
      <input type="file" id="Foto_Sebelum" accept="image/*" capture="environment" onchange="previewPhoto(this, 'prevSebelum')">
      <img id="prevSebelum" class="preview-img" alt="Preview Foto Sebelum">
    </div>

    <label>Foto Progress</label>
    <div class="photo-card">
      <input type="file" id="Foto_Progress" accept="image/*" capture="environment" onchange="previewPhoto(this, 'prevProgress')">
      <img id="prevProgress" class="preview-img" alt="Preview Foto Progress">
    </div>

    <label>Foto Sesudah</label>
    <div class="photo-card">
      <input type="file" id="Foto_Sesudah" accept="image/*" capture="environment" onchange="previewPhoto(this, 'prevSesudah')">
      <img id="prevSesudah" class="preview-img" alt="Preview Foto Sesudah">
    </div>

    <label>Catatan Tambahan (Opsional)</label>
    <textarea id="Catatan_Tambahan" placeholder="Kendala atau catatan tambahan..."></textarea>

    <label>Status Pekerjaan</label>
    <select id="Status_Pekerjaan">
      <option value="Done">Done</option>
      <option value="Progress">Progress</option>
      <option value="Pending">Pending</option>
    </select>

    <button type="submit" class="btn" id="submitBtn">Simpan Laporan</button>
  </form>

  <div class="history-box">
    <strong style="font-size: 0.9rem; color: #334155;">Riwayat Input di Perangkat Ini:</strong>
    <div id="historyList" style="margin-top: 8px;"></div>
  </div>
</div>

<script>
  // Daftarkan Service Worker agar aplikasi bisa jalan 100% offline setelah dibuka sekali
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW skip:', err));
    });
  }

  // Tangkap tombol Install App (Chrome/Edge/Android)
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').style.display = 'flex';
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('installBanner').style.display = 'none';
    }
    deferredPrompt = null;
  });

  const DEFAULT_SCRIPT_URL = "";
  const URL_KEY = "gwt_script_url";
  const QUEUE_KEY = "gwt_offline_queue_v1";
  const HISTORY_KEY = "gwt_local_history_v1";

  function getScriptUrl() {
    return localStorage.getItem(URL_KEY) || DEFAULT_SCRIPT_URL;
  }

  function saveScriptUrl() {
    const val = document.getElementById("scriptUrlInput").value.trim();
    if (!val.startsWith("http")) {
      alert("Masukkan URL Web App Google Apps Script yang valid (dimulai dengan https://...)");
      return;
    }
    localStorage.setItem(URL_KEY, val);
    document.getElementById("setupDetails").open = false;
    alert("URL Koneksi berhasil disimpan!");
    syncQueue();
  }

  document.getElementById("Tanggal_Kerja").valueAsDate = new Date();
  const savedUrl = getScriptUrl();
  if (savedUrl) {
    document.getElementById("scriptUrlInput").value = savedUrl;
  } else {
    document.getElementById("setupDetails").open = true;
  }

  function previewPhoto(input, imgId) {
    const img = document.getElementById(imgId);
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => {
        img.src = e.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      img.style.display = "none";
    }
  }

  function updateNetworkUI() {
    const badge = document.getElementById("netStatus");
    if (navigator.onLine) {
      badge.textContent = "Online";
      badge.className = "badge online";
      syncQueue();
    } else {
      badge.textContent = "Offline (Mode Lokal)";
      badge.className = "badge offline";
    }
    renderQueueInfo();
  }

  window.addEventListener("online", updateNetworkUI);
  window.addEventListener("offline", updateNetworkUI);

  function compressImage(file) {
    return new Promise((resolve) => {
      if (!file) return resolve("");
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 1024;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function getQueue() {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
  }

  function saveQueue(q) {
    localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
    renderQueueInfo();
  }

  function addHistory(item, synced) {
    let hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    hist.unshift({
      id: item.ID_Laporan,
      waktu: item.Waktu_Input,
      lokasi: item.Lokasi_Tower,
      uraian: item.Uraian_Pekerjaan,
      synced: synced
    });
    if (hist.length > 15) hist = hist.slice(0, 15);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistory();
  }

  function markHistorySynced(id) {
    let hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    hist = hist.map(h => h.id === id ? { ...h, synced: true } : h);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistory();
  }

  function renderHistory() {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    const container = document.getElementById("historyList");
    if (hist.length === 0) {
      container.innerHTML = "<div style='font-size:0.8rem; color:#64748b;'>Belum ada laporan di perangkat ini.</div>";
      return;
    }
    container.innerHTML = hist.map(h => `
      <div class="history-item ${h.synced ? '' : 'pending'}">
        <strong>${h.lokasi}</strong> (${h.waktu})<br>
        <span>${h.uraian}</span><br>
        <small style="color:${h.synced ? '#15803d' : '#a16207'}; font-weight:600;">
          ${h.synced ? '✓ Terkirim ke Google Sheet' : '⏳ Menunggu Sinyal (Offline)'}
        </small>
      </div>
    `).join("");
  }

  function renderQueueInfo() {
    const q = getQueue();
    const box = document.getElementById("queueBox");
    if (q.length > 0) {
      box.style.display = "block";
      document.getElementById("queueText").textContent =
        `Ada ${q.length} laporan tersimpan offline menunggu dikirim ke Google Sheet.`;
    } else {
      box.style.display = "none";
    }
  }

  async function sendPayload(payload) {
    const url = getScriptUrl();
    if (!url || !url.startsWith("http")) throw new Error("URL belum diatur");
    const res = await fetch(url, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  let isSyncing = false;
  async function syncQueue() {
    if (isSyncing || !navigator.onLine) return;
    let q = getQueue();
    if (q.length === 0) return;

    isSyncing = true;
    const syncBtn = document.getElementById("syncBtn");
    if (syncBtn) syncBtn.textContent = "Mengirim antrean...";

    const remaining = [];
    for (const item of q) {
      try {
        const result = await sendPayload(item);
        if (result.status === "success") {
          markHistorySynced(item.ID_Laporan);
        } else {
          remaining.push(item);
        }
      } catch (e) {
        remaining.push(item);
      }
    }
    saveQueue(remaining);
    isSyncing = false;
    if (syncBtn) syncBtn.textContent = "Kirim Semua Antrean Sekarang";
  }

  document.getElementById("reportForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const url = getScriptUrl();
    if (!url) {
      alert("Harap isi URL Web App Google Apps Script terlebih dahulu di menu Pengaturan Koneksi di atas.");
      document.getElementById("setupDetails").open = true;
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Memproses Foto & Data...";

    const now = new Date();
    const waktuInput = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0") + " " +
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0") + ":" +
      String(now.getSeconds()).padStart(2, "0");

    const payload = {
      ID_Laporan: Math.random().toString(16).substring(2, 10),
      Waktu_Input: waktuInput,
      Tanggal_Kerja: document.getElementById("Tanggal_Kerja").value,
      Nama_Teknisi: document.getElementById("Nama_Teknisi").value,
      Shift: document.getElementById("Shift").value,
      Lokasi_Tower: document.getElementById("Lokasi_Tower").value,
      Uraian_Pekerjaan: document.getElementById("Uraian_Pekerjaan").value,
      Foto_Sebelum: await compressImage(document.getElementById("Foto_Sebelum").files[0]),
      Foto_Progress: await compressImage(document.getElementById("Foto_Progress").files[0]),
      Foto_Sesudah: await compressImage(document.getElementById("Foto_Sesudah").files[0]),
      Catatan_Tambahan: document.getElementById("Catatan_Tambahan").value,
      Status_Pekerjaan: document.getElementById("Status_Pekerjaan").value
    };

    if (navigator.onLine) {
      try {
        const res = await sendPayload(payload);
        if (res.status === "success") {
          addHistory(payload, true);
          alert("Berhasil! Laporan langsung masuk ke Google Sheet.");
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        const q = getQueue();
        q.push(payload);
        saveQueue(q);
        addHistory(payload, false);
        alert("Koneksi tidak stabil. Laporan disimpan offline di perangkat dan akan otomatis terkirim saat sinyal kembali.");
      }
    } else {
      const q = getQueue();
      q.push(payload);
      saveQueue(q);
      addHistory(payload, false);
      alert("Mode Offline: Laporan tersimpan di perangkat dan akan otomatis terkirim ke Google Sheet saat online.");
    }

    document.getElementById("reportForm").reset();
    document.getElementById("Tanggal_Kerja").valueAsDate = new Date();
    ["prevSebelum", "prevProgress", "prevSesudah"].forEach(id => {
      document.getElementById(id).style.display = "none";
    });
    btn.disabled = false;
    btn.textContent = "Simpan Laporan";
  });

  renderHistory();
  updateNetworkUI();
</script>
</body>
</html>
